<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- This makes the page render properly on mobile widths instead of zoomed-out desktop view -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What if I invested?</title>

    <!-- Preconnect makes the Google Fonts request faster -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Loads Inter (body text) and Rubik (headings) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rubik:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="price-ticker" aria-hidden="true">
  <div class="ticker-track" id="ticker-track"></div>
</div>
    

    <header class="site-header">
      <h1>What if I invested?</h1>
      <p class="subtitle">See how a hypothetical investment in a digital asset would have changed over time.</p>
    </header>


    <main id="app">
      <!-- Input panel: investment amount and asset selector -->
      <section class="input-panel" aria-labelledby="input-heading">
        <h2 id="input-heading">Try it yourself</h2>
        <form id="investment-form">
          <div class="field">
            <label for="amount">Initial investment ($NZD)</label>
            <input type="number" id="amount" name="amount" min="1" step="1" value="100" required />
          </div>
          <div class="field">
            <label for="asset">Digital asset</label>
            <!-- This is filled in automatically by script.js -->
            <select id="asset" name="asset" required>
              <option value="" disabled selected>Select an asset</option>
            </select>
          </div>
          <button type="submit" class="calculate-btn">Calculate</button>
        </form>
      </section>

      <!-- aria-live means screen readers announce this when it changes (loading/error states) -->
      <p id="status-message" class="status-message" aria-live="polite"></p>

      <!-- Result cards get injected here by script.js -->
      <section class="results-dashboard" aria-labelledby="results-heading">
  <div class="results-header">
    <h2 id="results-heading">Results</h2>
    <p id="data-status-badge" class="status-badge" aria-live="polite"></p>
  </div>
  <div class="cards" id="results-cards"></div>
    </section>
    </main>

<!-- Disclaimer banner - covers the ethical messaging implication (not financial advice) -->
    <div class="disclaimer" role="note">
      <p><strong>This is an educational tool only.</strong> Figures are for learning purposes and are not financial advice.</p>
    </div>


    <!-- defer means this runs after the HTML has fully loaded -->
    <script src="./script.js" defer></script>
  </body>
</html>
